// 源文件删除后留下的空目录不应进入发布包或源码包。
tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
}

// 可选本地编译依赖，例如 -PcompatModsDir=D:/path/to/mods -PcompatModJars=Example.jar。
if (project.hasProperty('compatModsDir') && project.hasProperty('compatModJars')) {
    project.property('compatModJars').toString().split(',').each { name ->
        dependencies.add('compileOnly', modUtils.deobfuscate(files(new File(
                project.property('compatModsDir').toString(), name))))
    }
}
