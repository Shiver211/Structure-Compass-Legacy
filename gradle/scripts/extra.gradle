// Optional local dependencies for developing an adapter against a mod's public API.
// Example: -PcompatModsDir=D:/path/to/mods -PcompatModJars=Atum-1.12.2-2.0.21.jar
if (project.hasProperty('compatModsDir') && project.hasProperty('compatModJars')) {
    project.property('compatModJars').toString().split(',').each { name ->
        dependencies.add('compileOnly', rfg.deobf(files(new File(project.property('compatModsDir').toString(), name))))
    }
}
